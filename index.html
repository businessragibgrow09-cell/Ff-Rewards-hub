<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1d">
    <title>Garena Panel - Premium Gaming Collection</title>
    <style>
        /* ==========================================================================
           1. CORE STYLES & RESET
           ========================================================================== */
        :root {
            --bg-base: #060913;
            --bg-surface: rgba(18, 24, 43, 0.75);
            --bg-card: rgba(25, 34, 60, 0.55);
            --border-glow: rgba(99, 102, 241, 0.25);
            --border-highlight: rgba(168, 85, 247, 0.4);
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --status-green: #22c55e;
            --radius-main: 18px;
            --radius-btn: 12px;
            --shadow-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 50%),
                radial-gradient(circle at 100% 60%, rgba(168, 85, 247, 0.1), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* ==========================================================================
           2. LAYOUT & CONTAINER
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            position: relative;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 720px;
                padding: 24px;
            }
        }

        header {
            text-align: center;
            padding: 16px 0 12px 0;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--accent-cyan);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 10px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* ==========================================================================
           3. HERO SECTION
           ========================================================================== */
        .hero {
            text-align: center;
            margin: 16px 0 24px 0;
            padding: 20px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-main);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-glow);
        }

        .hero h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .hero p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ==========================================================================
           4. FEATURED / STORE GRID
           ========================================================================== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .section-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 350px) {
            .panel-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-main);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-top {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .card-meta {
            overflow: hidden;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            color: var(--status-green);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: var(--status-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--status-green);
        }

        /* ==========================================================================
           5. BUTTONS
           ========================================================================== */
        .btn-install {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid var(--border-highlight);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-install:active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        }

        .btn-primary {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn-primary:active {
            opacity: 0.9;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 12px;
        }

        .btn-back:active {
            color: var(--text-main);
        }

        /* ==========================================================================
           6. DETAIL PAGE & VIDEO PLAYER
           ========================================================================== */
        .detail-view {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-header {
            text-align: center;
            padding: 8px 0;
        }

        .detail-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
        }

        .detail-sub {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-glow);
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Centered Play/Pause Overlay Button */
        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .play-overlay-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        .play-overlay-btn.hidden-play {
            opacity: 0;
            pointer-events: none;
        }

        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-main);
            padding: 20px 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            box-shadow: var(--shadow-glow);
        }

        .info-card-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-card-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .info-card-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .info-card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .rating-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #f59e0b;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .rating-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-left: 4px;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 16px 0 20px 0;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.72rem;
            color: var(--text-main);
        }

        .cta-note {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* ==========================================================================
           7. FOOTER
           ========================================================================== */
        footer {
            margin-top: auto;
            padding: 24px 0 12px 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        footer p:first-child {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="brand-title" id="brand-title">GARENA PANEL</div>
            <div class="brand-subtitle">PREMIUM GAMING COLLECTION</div>
            <div class="badge-status">
                <span class="badge-dot"></span>
                <span>APP COLLECTION</span>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main id="main-content">
            <!-- Dynamic Content Injected via JavaScript -->
        </main>

        <!-- FOOTER -->
        <footer>
            <p id="footer-copyright">© 2026 GARENA PANEL</p>
            <p>Browse • Choose • Install</p>
        </footer>

    </div>

    <!-- ==========================================================================
       8. JAVASCRIPT & CONFIGURATION
       ========================================================================== -->
    <script>
        /* ----------------------------------------------------------------------
           CENTRAL CONFIGURATION OBJECT
           Aapke saare specific Panel Names aur exact Image Links
           ---------------------------------------------------------------------- */
        const SITE_CONFIG = {
            brandName: "GARENA PANEL",
            
            // Catbox MP4 Direct Video Link
            videoUrl: "https://files.catbox.moe/72v3fp.mp4", 

            // Exact Panel list matching your provided logos and names
            panels: [
                {
                    id: 1,
                    name: "CLT PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "Auto Headshot & Aim Lock",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                },
                {
                    id: 2,
                    name: "MACRO SPACE PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "Ultra Sensitivity & Macro Boost",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                },
                {
                    id: 3,
                    name: "GARENA PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "Official Mod & ESP Location",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                },
                {
                    id: 4,
                    name: "DARK AURA PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "High Damage & Invisibility",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                },
                {
                    id: 5,
                    name: "WRATH PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "Speed Run & Zero Recoil",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                },
                {
                    id: 6,
                    name: "TITAN VIP PANEL",
                    logo: "https://i.ibb.co/KpDTxmDZ/images-3.jpg",
                    description: "All-In-One Injector Menu",
                    downloadUrl: "https://1024terabox.com/s/1ixJRm-dF7Xz10I_RhPKSUA"
                }
            ]
        };

        /* ----------------------------------------------------------------------
           APPLICATION ENGINE
           ---------------------------------------------------------------------- */
        
        function initBranding() {
            document.getElementById('brand-title').textContent = SITE_CONFIG.brandName;
            document.getElementById('footer-copyright').textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.brandName}`;
            document.title = `${SITE_CONFIG.brandName} - Premium Panels`;
        }

        function renderHome() {
            const container = document.getElementById('main-content');
            
            let cardsHtml = SITE_CONFIG.panels.map(panel => `
                <div class="card">
                    <div>
                        <div class="card-top">
                            <img class="card-icon" 
                                 src="${panel.logo}" 
                                 alt="${panel.name} logo"
                                 onerror="this.onerror=null; this.src='https://i.ibb.co/KpDTxmDZ/images-3.jpg';">
                            <div class="card-meta">
                                <div class="card-title">${panel.name}</div>
                                <div class="card-desc">${panel.description}</div>
                            </div>
                        </div>
                        <div class="card-status">
                            <span class="status-dot"></span>
                            <span>Available now</span>
                        </div>
                    </div>
                    <button class="btn-install" onclick="openPanel(${panel.id})" aria-label="Install ${panel.name}">
                        <span>↓</span> Install
                    </button>
                </div>
            `).join('');

            container.innerHTML = `
                <section class="hero">
                    <h1>Discover Your Next Panel</h1>
                    <p>Choose a panel below and tap Install to continue.</p>
                </section>

                <section>
                    <div class="section-header">
                        <span class="section-title">Featured Panels</span>
                        <span class="section-count">${SITE_CONFIG.panels.length} Panels</span>
                    </div>
                    <div class="panel-grid">
                        ${cardsHtml}
                    </div>
                </section>
            `;
        }

        function renderPanelDetail(panelId) {
            const container = document.getElementById('main-content');
            const panel = SITE_CONFIG.panels.find(p => p.id === panelId);

            if (!panel) {
                goHome();
                return;
            }

            let videoHtml = '';
            if (SITE_CONFIG.videoUrl && SITE_CONFIG.videoUrl.trim() !== '') {
                videoHtml = `
                    <div style="position: relative; width:100%; height:100%; flex: 1; display:flex; align-items:center; justify-content:center;">
                        <video id="detailVideo" controls playsinline preload="auto">
                            <source src="${SITE_CONFIG.videoUrl}" type="video/mp4">
                            Your browser does not support HTML5 video.
                        </video>
                        <button class="play-overlay-btn" id="customPlayBtn" onclick="togglePlayPause()" aria-label="Play/Pause Video">
                            <svg id="playIcon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </button>
                    </div>
                `;
            } else {
                videoHtml = `
                    <div class="video-placeholder">
                        <svg width="36" height="36" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <span>Preview Video Placeholder</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="detail-view">
                    <div>
                        <button class="btn-back" onclick="goHome()" aria-label="Back to store">
                            ← Back to Panel Store
                        </button>
                        <div class="detail-header">
                            <h2 class="detail-title">${panel.name}</h2>
                            <div class="detail-sub">PREMIUM GAMING EXPERIENCE</div>
                        </div>
                    </div>

                    <div class="video-wrapper">
                        ${videoHtml}
                    </div>

                    <div class="info-card">
                        <div class="info-card-top">
                            <img class="info-card-icon" 
                                 src="${panel.logo}" 
                                 alt="${panel.name} logo"
                                 onerror="this.onerror=null; this.src='https://i.ibb.co/KpDTxmDZ/images-3.jpg';">
                            <div class="info-card-name">${panel.name}</div>
                            <div class="info-card-sub">Download ${panel.name}</div>
                            <div class="rating-box">
                                ★★★★★ <span class="rating-text">Premium Experience</span>
                            </div>
                        </div>

                        <div class="chips-container">
                            <span class="chip">⚡ Fast Experience</span>
                            <span class="chip">🎮 Gaming Ready</span>
                            <span class="chip">✦ Easy Setup</span>
                            <span class="chip">📱 Mobile Friendly</span>
                        </div>

                        <button class="btn-primary" onclick="triggerDownload('${panel.downloadUrl}')">
                            ↓ INSTALL NOW
                        </button>
                        <p class="cta-note">Tap the button above to continue to the download page.</p>
                    </div>
                </div>
            `;
        }

        // Play/Pause Video Trigger with Audio Unmute
        function togglePlayPause() {
            const video = document.getElementById('detailVideo');
            const btn = document.getElementById('customPlayBtn');
            if (!video) return;

            if (video.paused) {
                video.muted = false;
                video.play();
                if (btn) btn.classList.add('hidden-play');
            } else {
                video.pause();
                if (btn) btn.classList.remove('hidden-play');
            }
        }

        function openPanel(panelId) {
            const url = new URL(window.location);
            url.searchParams.set('panel', panelId);
            window.history.pushState({ panelId }, '', url);
            renderPanelDetail(panelId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            const url = new URL(window.location);
            url.searchParams.delete('panel');
            window.history.pushState({}, '', url.pathname);
            renderHome();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerDownload(targetUrl) {
            if (targetUrl) {
                window.location.href = targetUrl;
            }
        }

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const panelParam = urlParams.get('panel');

            if (panelParam) {
                const panelId = parseInt(panelParam, 10);
                if (!isNaN(panelId)) {
                    renderPanelDetail(panelId);
                    return;
                }
            }
            renderHome();
        }

        window.addEventListener('popstate', handleRouting);

        document.addEventListener('DOMContentLoaded', () => {
            initBranding();
            handleRouting();
        });
    </script>
</body>
</html>
